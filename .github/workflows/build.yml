name: Build DANA V12 APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: stable

      - name: Setup Python for icon
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate App Icons from your logo
        run: |
          python3 << 'PY'
          from PIL import Image
          import os
          src = "IMG-20261003-WA7721.jpg"
          print(f"Using {src}")
          img = Image.open(src).convert("RGBA")
          # Make square with white background
          size = max(img.size)
          new_img = Image.new("RGBA", (size, size), (255,255,255,0))
          new_img.paste(img, ((size-img.size[0])//2, (size-img.size[1])//2))
          # Android densities
          icons = {
            "mipmap-mdpi": 48,
            "mipmap-hdpi": 72,
            "mipmap-xhdpi": 96,
            "mipmap-xxhdpi": 144,
            "mipmap-xxxhdpi": 192
          }
          for folder, s in icons.items():
            path = f"android/app/src/main/res/{folder}"
            os.makedirs(path, exist_ok=True)
            out = os.path.join(path, "ic_launcher.png")
            resized = new_img.resize((s, s), Image.LANCZOS)
            resized.save(out)
            print(f"Created {out}")
          print("Icons done!")
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DANA-V12-APK-With-Logo
          path: build/app/outputs/flutter-apk/app-release.apk
